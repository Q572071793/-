<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年会抽奖系统 - PickerBot</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-dice"></i>
                <h1 id="systemTitleDisplay">PickerBot 抽奖系统</h1>
            </div>
            <div class="controls">
                <button class="btn btn-secondary" id="settingsBtn">
                    <i class="fas fa-cog"></i>
                    设置
                </button>
                <button class="btn btn-primary" id="importBtn">
                    <i class="fas fa-upload"></i>
                    导入名单
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Participant Display -->
            <section class="participants-section">
                <div class="section-header">
                    <h2>参与人员</h2>
                    <div class="participant-controls">
                        <span class="participant-count">共 <span id="totalCount">0</span> 人</span>
                        <button class="btn btn-warning" id="clearParticipantsBtn">
                            <i class="fas fa-eraser"></i>
                            清空人员
                        </button>
                        <button class="btn btn-danger" id="batchDeleteBtn" style="display: none;">
                            <i class="fas fa-trash"></i>
                            批量删除
                        </button>
                    </div>
                </div>
                <div class="participants-grid" id="participantsGrid">
                    <!-- Participants will be dynamically added here -->
                </div>
            </section>

            <!-- Lottery Display -->
            <section class="lottery-section">
                <div class="lottery-container">
                    <div class="lottery-display">
                        <div class="winner-showcase" id="winnerShowcase">
                            <div class="winner-placeholder">
                                <i class="fas fa-trophy"></i>
                                <p>点击开始抽奖</p>
                            </div>
                        </div>
                        <div class="lottery-controls">
                            <button class="btn btn-start" id="startLottery">
                                <i class="fas fa-play"></i>
                                开始抽奖
                            </button>
                            <button class="btn btn-stop" id="stopLottery" disabled>
                                <i class="fas fa-stop"></i>
                                停止抽奖
                            </button>
                            <button class="btn btn-reset" id="resetLottery">
                                <i class="fas fa-redo"></i>
                                重置
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Winners History -->
            <section class="winners-section">
                <div class="section-header">
                    <h2>中奖记录</h2>
                    <div class="winners-actions">
                        <button class="btn btn-export" id="exportWinners">
                            <i class="fas fa-download"></i>
                            导出记录
                        </button>
                        <button class="btn btn-clear" id="clearWinners">
                            <i class="fas fa-trash"></i>
                            清空记录
                        </button>
                    </div>
                </div>
                <div class="winners-list" id="winnersList">
                    <div class="no-winners">
                        <i class="fas fa-clipboard-list"></i>
                        <p>暂无中奖记录</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>抽奖设置</h3>
                <button class="modal-close" id="closeSettings">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <!-- System Title Customization -->
                <div class="setting-group">
                    <label for="systemTitle">系统标题:</label>
                    <input type="text" id="systemTitle" placeholder="输入自定义标题" style="flex: 1; margin-left: 15px;">
                </div>
                
                <!-- Background Customization -->
                <div class="setting-group">
                    <label for="backgroundImage">背景图片:</label>
                    <input type="file" id="backgroundImage" accept="image/*" style="flex: 1; margin-left: 15px;">
                </div>
                
                <div class="setting-group">
                    <label>背景选项:</label>
                    <div style="flex: 1; margin-left: 15px;">
                        <button class="btn btn-secondary" id="resetBackground" style="margin-right: 10px;">重置背景</button>
                        <button class="btn btn-secondary" id="applyFestivalTheme">喜庆主题</button>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label for="lotterySpeed">抽奖速度:</label>
                    <input type="range" id="lotterySpeed" min="50" max="500" value="200">
                    <span id="speedValue">200ms</span>
                </div>
                <div class="setting-group">
                    <label for="animationDuration">动画时长:</label>
                    <input type="range" id="animationDuration" min="2000" max="10000" value="5000">
                    <span id="durationValue">5秒</span>
                </div>
                <div class="setting-group">
                    <label for="allowDuplicates">允许重复中奖:</label>
                    <input type="checkbox" id="allowDuplicates">
                </div>
                <div class="setting-group">
                    <label for="soundEnabled">启用音效:</label>
                    <input type="checkbox" id="soundEnabled" checked>
                </div>
                <div class="setting-group" style="display: none;">
                    <label for="disableAutoScroll">禁用自动滚动:</label>
                    <input type="checkbox" id="disableAutoScroll" checked>
                </div>
                <div class="setting-group">
                    <label for="lotteryMode">抽奖方式:</label>
                    <select id="lotteryMode" style="flex: 1; margin-left: 15px;">
                        <option value="sequential">逐个展示</option>
                        <option value="batch">一次性展示</option>
                    </select>
                </div>
                
                <!-- Prize Management -->
                <div class="prize-management">
                    <h4>奖项设置</h4>
                    <div class="prize-list" id="prizeList">
                        <!-- Prizes will be dynamically added here -->
                    </div>
                    <div class="add-prize-group">
                        <input type="text" id="newPrizeName" placeholder="输入奖项名称">
                        <input type="number" id="newPrizeCount" placeholder="人数" min="1" max="10" value="1" style="width: 80px;">
                        <button class="btn btn-secondary" id="addPrizeBtn">
                            <i class="fas fa-plus"></i>
                            添加奖项
                        </button>
                    </div>
                    <div class="prize-presets">
                        <button class="btn btn-secondary" id="loadDefaultPrizes">加载默认奖项</button>
                        <button class="btn btn-secondary" id="clearAllPrizes">清空所有奖项</button>
                        <button class="btn btn-warning" id="clearLocalStorage">清除缓存</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelSettings">取消</button>
                <button class="btn btn-primary" id="saveSettings">保存设置</button>
            </div>
        </div>
    </div>

    <!-- Edit Prize Modal -->
    <div class="modal" id="editPrizeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑奖项</h3>
                <button class="modal-close" id="closeEditPrize">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="editPrizeName">奖项名称:</label>
                    <input type="text" id="editPrizeName" placeholder="请输入奖项名称" style="flex: 1; margin-left: 15px;">
                </div>
                <div class="setting-group">
                    <label for="editPrizeCount">中奖人数:</label>
                    <input type="number" id="editPrizeCount" min="1" max="100" value="1" style="flex: 1; margin-left: 15px;">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelEditPrize">取消</button>
                <button class="btn btn-primary" id="saveEditPrize">保存</button>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>导入参与人员</h3>
                <button class="modal-close" id="closeImport">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="import-options">
                    <div class="import-option">
                        <h4>手动输入</h4>
                        <textarea id="manualInput" placeholder="请输入参与人员姓名，每行一个"></textarea>
                    </div>
                    <div class="import-option">
                        <h4>文件导入</h4>
                        <input type="file" id="fileInput" accept=".txt,.csv">
                        <p class="file-hint">支持 .txt 和 .csv 文件</p>
                    </div>
                    <div class="import-option">
                        <h4>示例数据</h4>
                        <button class="btn btn-secondary" id="loadSample">加载示例数据</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelImport">取消</button>
                <button class="btn btn-primary" id="confirmImport">确认导入</button>
            </div>
        </div>
    </div>

    <!-- Winner Announcement Modal -->
    <div class="modal" id="winnerModal">
        <div class="modal-content winner-announcement">
            <div class="winner-content">
                <div class="winner-icon">
                    <i class="fas fa-crown"></i>
                </div>
                <h2>恭喜中奖！</h2>
                <div class="winner-name" id="winnerName"></div>
                <div class="winner-prize" id="winnerPrize"></div>
                <button class="btn btn-primary" id="closeWinner">确定</button>
            </div>
        </div>
    </div>

    <!-- Export Winners Modal -->
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>导出中奖记录</h3>
                <button class="modal-close" id="closeExport">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="export-options">
                    <div class="export-option">
                        <h4>选择导出格式</h4>
                        <div class="export-format-group">
                            <label class="radio-label">
                                <input type="radio" name="exportFormat" value="csv" checked>
                                <span>CSV格式</span>
                                <small>适合Excel打开</small>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="exportFormat" value="json">
                                <span>JSON格式</span>
                                <small>适合程序处理</small>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="exportFormat" value="txt">
                                <span>纯文本格式</span>
                                <small>简单易读</small>
                            </label>
                        </div>
                    </div>
                    <div class="export-option">
                        <h4>导出内容</h4>
                        <div class="export-content-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="includeTimestamp" checked>
                                <span>包含时间戳</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="includePrize" checked>
                                <span>包含奖项信息</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelExport">取消</button>
                <button class="btn btn-primary" id="confirmExport">确认导出</button>
            </div>
        </div>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <script src="script.js"></script>
</body>
</html>
